<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | SPOKE Tech Superstore</title>
    <link rel="icon" type="image/svg+xml" href="spek_logo_green_white.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;800&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #0f172a;
            --accent: #06b6d4;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --text-main: #334155;
            --text-light: #64748b;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        .error-container {
            text-align: center;
            padding: 3rem 2.5rem;
            max-width: 680px;
            width: 90%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(226, 232, 240, 0.8);
            position: relative;
            z-index: 1;
        }

        .logo-emblem {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background: linear-gradient(135deg, #1e3a8a, #2563eb, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            margin: 0 auto 1.2rem auto;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        .error-code {
            font-size: 6.5rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 0.8rem;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: -2px;
        }

        .error-tagline {
            font-size: 1.4rem;
            color: var(--secondary);
            font-weight: 800;
            margin-bottom: 0.8rem;
        }

        .error-desc {
            color: var(--text-light);
            margin-bottom: 2rem;
            font-size: 0.95rem;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.85rem 1.8rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.92rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.4);
        }

        .btn-outline {
            border: 1.5px solid #cbd5e1;
            color: var(--secondary);
            background: #ffffff;
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .blob {
            position: absolute;
            width: 450px;
            height: 450px;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.15) 0%, rgba(6, 182, 212, 0.1) 100%);
            filter: blur(90px);
            border-radius: 50%;
            z-index: 0;
        }
        .blob-1 { top: -100px; left: -100px; }
        .blob-2 { bottom: -100px; right: -100px; }
    </style>
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="error-container">
        <div class="logo-emblem">S</div>
        <div class="error-code">404</div>
        <div class="error-tagline">Product or Page Not Found</div>
        <p class="error-desc">
            The page or tech product you requested is currently unavailable. Return to the homepage to explore laptops, 160+ components, ANC earbuds, and accessories.
        </p>

        <div class="btn-group">
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-home"></i> Back to Superstore
            </a>
            <a href="index.html?category=Laptops+%26+Notebooks" class="btn btn-outline">
                <i class="fas fa-laptop"></i> View Laptops
            </a>
        </div>
    </div>
</body>

</html>
